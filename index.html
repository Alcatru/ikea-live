<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0058a3">
<title>IKEA live · This room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Same look as the big screen: the blue IKEA poster. White type, yellow tag and badges, white cards, map on a white disc. */
  body { background: #fff; color: var(--ink); min-height: 100svh; }
  .app { max-width: 460px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; background: var(--blue); color: #fff; }
  header .tagy { font-size: 11px; }
  header .ttl { font: 700 14px var(--sans); flex: 1; }
  header .st { font: 600 11px var(--sans); display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,.75); }
  main { flex: 1; padding: 0 16px 8px; }
  .hero { background: var(--blue); color: #fff; margin: 0 -16px 4px; padding: 4px 16px 20px; }
  .hero h1, .hero .step { margin-bottom: 0; }
  .wait { text-align: center; padding: 60px 10px; color: var(--grey); }
  .tagy.k { font-size: 11px; margin-top: 4px; }
  h1 { font: 800 28px/1.08 var(--sans); letter-spacing: -.01em; margin: 10px 0 14px; }
  .step { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
  .step .badge { font-size: 16px; width: 32px; height: 32px; }
  .step h1 { margin: 0; font-size: 25px; }
  .mapbox { margin: 10px auto 6px; width: min(100%, 380px); animation: rise .5s ease-out both; }
  .one { font: 700 16px/1.35 var(--sans); margin: 14px 0; animation: rise .45s ease-out both; }
  .one .sticker { font-size: 15px; background: var(--blue); color: #fff; }
  .one.muted { color: var(--grey); font-weight: 600; font-size: 13.5px; text-align: center; }
  .q { margin: 16px 0 10px; font: 800 19px/1.22 var(--sans); }
  .opts { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
  .opts.n4 { grid-template-columns: repeat(2, 1fr); }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px 12px; border: 0; border-radius: 12px; background: var(--soft); color: var(--ink); font: 700 14px/1.15 var(--sans); text-align: center; cursor: pointer; transition: transform .1s, background .15s; }
  .opt .ico { width: 44px; height: 44px; }
  .opt:active { transform: scale(.97); }
  .opt.sel { background: var(--yellow); }
  .opts.done .opt:not(.sel) { opacity: .45; }
  .legend .sw { border-color: var(--ink); border-width: 1.5px; }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font: 700 12.5px var(--sans); margin: 2px 0 6px; }
  .look { text-align: center; font: 800 32px var(--sans); margin: 56px 0 20px; }
  .look.rest { margin: 48px 0 20px; font: 600 16px/1.45 var(--sans); color: var(--grey); }
  .look.rest .ico { width: 120px; height: 120px; }
  .look .ico { width: 96px; height: 96px; margin: 0 auto 14px; color: var(--blue); animation: pulse2 1.4s ease-in-out infinite; }
  @keyframes pulse2 { 50% { transform: translateY(-6px); } }
  .ctx { display: flex; gap: 12px; align-items: center; background: var(--soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
  .ctx svg { width: 84px; flex: none; } .ctx p { margin: 0; font-size: 14.5px; line-height: 1.35; }
  footer a { color: inherit; }
  footer { padding: 12px 16px 20px; font-size: 11px; line-height: 1.5; color: var(--grey); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="tagy">Live</span>
    <span class="ttl">This room</span>
    <span class="st"><span class="status-dot" id="dot"></span><span id="stxt">connecting</span></span>
  </header>
  <main id="main"><div class="wait">Connecting to the presentation…</div></main>
  <footer>Student project · Innovation Strategy, University of Fribourg<br><a href="https://github.com/Alcatru" target="_blank" rel="noopener">github.com/Alcatru</a></footer>
</div>
<script src="lib/mqtt.min.js"></script>
<script src="js/common.js"></script>
<script src="js/icons.js"></script>
<script src="js/rings.js"></script>
<script>
(function () {
  const { QUESTIONS, ZONES, PHASES, store, uid } = IKL;
  document.head.insertAdjacentHTML("beforeend", `<style>${ROOMMAP_CSS}</style>`);
  const $main = document.getElementById("main");
  let phase = null, run = null, id = null, rec = null, shown = null, others = {}, timer = null;

  function save() {
    store.set("rec:" + run, { id, rec });
    if (net.connected) net.publishRecord(run, id, Object.assign({ t: Date.now() }, rec));
  }
  function ensureRecord() {
    const saved = store.get("rec:" + run);
    if (saved && saved.rec && saved.rec.a) { id = saved.id; rec = saved.rec; }
    else { id = uid(); rec = { a: {} }; }
  }
  function question(key) {
    const Qd = QUESTIONS[key], cur = rec.a[key];
    return `<div class="q">${Qd.q}</div><div class="opts ${Qd.opts.length === 4 ? "n4" : ""} ${cur ? "done" : ""}" data-q="${key}">` +
      Qd.opts.map(([v, e, l]) => `<button class="opt ${cur === v ? "sel" : ""}" data-v="${v}">${ICON(e)}${l}</button>`).join("") + "</div>";
  }
  const lookUp = (t) => `<div class="look">${ICON("up")}Look up!<p class="one muted">${t}</p></div>`;
  const line = (t, cls = "") => `<p class="one ${cls}">${t}</p>`;
  function map() {
    const all = Object.assign({}, others); if (rec.a.home) all[id] = rec;
    return `<div class="mapbox">${roomMap(phase, all, id)}</div>`;
  }
  const LEG = {
    got: '<div class="legend"><span><i class="sw" style="background:var(--blue)"></i>Own car</span><span><i class="sw" style="background:var(--yellow)"></i>No own car</span></div>',
    react: '<div class="legend"><span><i class="sw" style="background:var(--green)"></i>Fine</span><span><i class="sw" style="background:#f28c28"></i>Meh</span><span><i class="sw" style="background:var(--red)"></i>Want it now</span></div>',
  };

  function body() {
    const a = rec.a;
    switch (phase) {
      case "s0":
        return map() + (a.got ? LEG.got : "") + question("got") +
          (a.got ? line(`<span class="sticker">${a.got === "car" ? "You are the customer the blue box was built for." : "The blue box assumes you have a car."}</span>`) : "");
      case "s1":
      case "s2":
      case "s5": return lookUp(phase === "s5" ? "One last vote after our recommendations." : "Your dot is on the big screen.");
      case "s3": return map() + (a.react ? LEG.react : "") + question("react") + (a.react ? line('<span class="sticker">Remember this feeling.</span>') : "");
      case "s4": return lookUp("Will it fit?");
      case "end": return question("after") + (a.after ? line('<span class="sticker">Thanks! Look at the screen.</span>') : "") + map();
    }
    return "";
  }

  /* Once the person has answered the question of the current moment, the phone goes quiet: after a short confirmation it
     shows a big "Look up!" until the next live moment, so people watch the presenters, not their phone. */
  const NEED = { join: "before", s0: "got", s3: "react", end: "after" };
  const answeredAt = {};
  const SETTLE = 4500;
  function resting() {
    const k = NEED[phase], a = rec.a;
    if (!a.home) return false;
    if (phase === "join" && rec.late) return true;
    if (phase === "s0" && !a.before && !rec.late) return false;   // still owes the gut-feeling vote
    if (!k || !a[k]) return false;
    return !answeredAt[phase] || Date.now() - answeredAt[phase] >= SETTLE;
  }
  const restScreen = () => `<div class="hero"><p class="tagy k">${phase === "end" ? "Thank you" : "Your answer is in"}</p><h1>Look up!</h1></div>
    <div class="look rest">${ICON("up")}<p>${phase === "end" ? "The result is on the big screen." : "Watch the presentation.<br>We'll tell you when to grab your phone again."}</p></div>`;

  function render(force) {
    if (!run) return;
    const rest = resting();
    const key = rest + "|" + phase + "|" + JSON.stringify(rec.a) + "|" + Object.keys(others).length + "|" + JSON.stringify(others).length;
    if (!force && key === shown) return;
    const samePhase = shown && shown.split("|")[1] === phase, y = window.scrollY;
    shown = key;
    const a = rec.a;
    if (rest) {
      $main.innerHTML = restScreen();
    } else if (!a.home) {
      $main.innerHTML = `<div class="hero"><p class="tagy k">Hej! Two taps, anonymous</p><h1>Where do you live?</h1></div><div style="height:12px"></div>${question("home").replace(/<div class="q">.*?<\/div>/, "")}`;
    } else if (phase === "join" || (phase === "s0" && !a.before && !rec.late)) {
      $main.innerHTML = `<div class="hero"><p class="tagy k">Before we start</p><h1>You are on the map.</h1></div>${map()}
        <div class="ctx"><svg viewBox="0 0 120 70" aria-hidden="true" stroke="#111" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="52" width="108" height="12" fill="#fff"/><path d="M20 55v6M36 55v6M52 55v6M68 55v6M84 55v6M100 55v6" stroke-width="1.2"/><path d="M24 20 l10 -7 h62 l-10 7z" fill="#3f84c4"/><path d="M86 20 l10 -7 v30 l-10 7z" fill="#004a8c"/><rect x="24" y="20" width="62" height="30" fill="var(--blue)"/><rect x="24" y="25" width="62" height="5" fill="var(--yellow)"/><rect x="48" y="38" width="14" height="12" fill="#fff"/></svg>
        <p><b>IKEA's classic model:</b> a huge store outside town that you drive to.</p></div>
        ${question("before")}${a.before ? line("Thanks! We'll ask again at the very end.", "muted") : line("Quick gut feeling. We'll ask again at the end.", "muted")}`;
    } else {
      const Zd = ZONES[phase];
      $main.innerHTML = `<div class="hero"><p class="tagy k">${Zd.step}</p><div class="step"><span class="badge">${Zd.n}</span><h1>${Zd.title}</h1></div></div>${body()}`;
    }
    window.scrollTo(0, samePhase ? y : 0);
  }
  function soon() { clearTimeout(timer); timer = setTimeout(() => render(), 300); }

  $main.addEventListener("click", (e) => {
    const b = e.target.closest(".opt"); if (!b) return;
    rec.a[b.parentElement.dataset.q] = b.dataset.v; save();
    const answeredPhase = phase; answeredAt[answeredPhase] = Date.now();
    setTimeout(() => { if (phase === answeredPhase) render(true); }, SETTLE + 50);
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {}
    render();
  });

  const net = IKL.connect({
    onStatus(on) {
      document.getElementById("dot").classList.toggle("on", on);
      document.getElementById("stxt").textContent = on ? "live" : "reconnecting";
      if (on && run && rec && rec.a.home) save();
    },
    onState(st) {
      const newRun = st.run !== run;
      const prevPhase = phase;
      run = st.run; phase = PHASES.includes(st.phase) ? st.phase : "join";
      if (prevPhase && prevPhase !== phase && NEED[phase] && navigator.vibrate) try { navigator.vibrate([60, 80, 60]); } catch (x) {} // a new question
      if (newRun) {
        others = {}; ensureRecord();
        if (PHASES.indexOf(phase) > 1 && !rec.a.before) rec.late = true; // joined after Step 0: no "before" vote
      }
      render(true);
    },
    onRecord(rid, r) { if (rid === id) return; if (r) others[rid] = r; else delete others[rid]; soon(); },
  });
})();
</script>
</body>
</html>
