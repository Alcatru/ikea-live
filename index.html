<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0058a3">
<title>IKEA live · This room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--soft); min-height: 100svh; }
  .app { max-width: 460px; margin: 0 auto; min-height: 100svh; background: var(--paper); display: flex; flex-direction: column; }
  header { background: var(--blue); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
  header .tag { background: var(--yellow); color: var(--ink); font: 800 12px var(--sans); letter-spacing: .04em; padding: 4px 8px; border-radius: 3px; }
  header .ttl { font: 700 15px var(--sans); flex: 1; }
  header .st { font: 600 11px var(--sans); display: flex; align-items: center; gap: 6px; }
  main { flex: 1; padding: 14px 16px 8px; }
  .wait { text-align: center; padding: 60px 10px; color: var(--grey); }
  .kicker { margin: 0; }
  h1 { font: 800 25px/1.15 var(--sans); margin: 4px 0 10px; }
  .step { display: flex; align-items: center; gap: 10px; }
  .num { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--yellow); display: grid; place-items: center; font: 700 16px var(--grot); flex: none; }
  .mapbox { margin: 6px -6px 4px; animation: rise .5s ease-out both; }
  .one { font-size: 17px; line-height: 1.35; margin: 8px 0; animation: rise .45s ease-out both; }
  .one.muted { color: var(--grey); font-size: 14px; text-align: center; }
  .q { margin: 14px 0 8px; font: 800 18px/1.25 var(--sans); }
  .opts { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
  .opts.n4 { grid-template-columns: repeat(2, 1fr); }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font: 700 14px/1.2 var(--sans); text-align: center; cursor: pointer; transition: transform .1s; }
  .opt .e { font-size: 34px; line-height: 1.1; }
  .opt:active { transform: scale(.96); }
  .opt.sel { background: var(--yellow); }
  .opts.done .opt:not(.sel) { opacity: .4; }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font: 700 12.5px var(--sans); color: #444; margin: 2px 0 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); vertical-align: -1px; margin-right: 5px; }
  .look { text-align: center; font: 800 30px var(--sans); margin: 60px 0 20px; }
  .look span { font-size: 72px; display: block; animation: pulse2 1.4s ease-in-out infinite; }
  @keyframes pulse2 { 50% { transform: translateY(-6px); } }
  footer { padding: 12px 16px 20px; font-size: 11px; color: var(--grey); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="tag">LIVE</span>
    <span class="ttl">This room</span>
    <span class="st"><span class="status-dot" id="dot"></span><span id="stxt">connecting</span></span>
  </header>
  <main id="main"><div class="wait">Connecting to the presentation…</div></main>
  <footer>Student project · Innovation Strategy, University of Fribourg.<br>Not affiliated with IKEA. Anonymous: no name, no personal data.</footer>
</div>
<script src="lib/mqtt.min.js"></script>
<script src="js/common.js"></script>
<script src="js/rings.js"></script>
<script>
(function () {
  const { QUESTIONS, ZONES, PHASES, store, uid } = IKL;
  document.head.insertAdjacentHTML("beforeend", `<style>${ROOMMAP_CSS}</style>`);
  const $main = document.getElementById("main");
  let phase = null, run = null, id = null, rec = null, shown = null, others = {}, timer = null;

  function save() {
    store.set("rec:" + run, { id, rec });
    if (net.connected) net.publishRecord(run, id, Object.assign({ t: Date.now() }, rec));
  }
  function ensureRecord() {
    const saved = store.get("rec:" + run);
    if (saved && saved.rec && saved.rec.a) { id = saved.id; rec = saved.rec; }
    else { id = uid(); rec = { a: {} }; }
  }
  function question(key) {
    const Qd = QUESTIONS[key], cur = rec.a[key];
    return `<div class="q">${Qd.q}</div><div class="opts ${Qd.opts.length === 4 ? "n4" : ""} ${cur ? "done" : ""}" data-q="${key}">` +
      Qd.opts.map(([v, e, l]) => `<button class="opt ${cur === v ? "sel" : ""}" data-v="${v}"><span class="e">${e}</span>${l}</button>`).join("") + "</div>";
  }
  const lookUp = (t) => `<div class="look"><span>👀</span>Look up!<p class="one muted">${t}</p></div>`;
  const line = (t, cls = "") => `<p class="one ${cls}">${t}</p>`;
  function map() {
    const all = Object.assign({}, others); if (rec.a.home) all[id] = rec;
    return `<div class="mapbox">${roomMap(phase, all, id)}</div>`;
  }
  const LEG = {
    got: '<div class="legend"><span><i style="background:var(--blue)"></i>Own car</span><span><i style="background:var(--yellow)"></i>No own car</span></div>',
    react: '<div class="legend"><span><i style="background:var(--green)"></i>Fine</span><span><i style="background:#f28c28"></i>Meh</span><span><i style="background:var(--red)"></i>Want it now</span></div>',
  };

  function body() {
    const a = rec.a;
    switch (phase) {
      case "s0":
        return map() + (a.got ? LEG.got : "") + question("got") +
          (a.got ? line(a.got === "car" ? "<b>You are the customer the blue box was built for.</b>" : "<b>No own car.</b> The blue box assumes you have one.") : "");
      case "s1":
      case "s2":
      case "s5": return lookUp(phase === "s5" ? "One last vote after our recommendations." : "Your dot is on the big screen.");
      case "s3": return map() + (a.react ? LEG.react : "") + question("react") + (a.react ? line("<b>Remember this feeling.</b>") : "");
      case "s4": return lookUp("Will it fit?");
      case "end": return question("after") + (a.after ? line("<b>Thanks!</b> Look at the screen.") : "") + map();
    }
    return "";
  }

  function render(force) {
    if (!run) return;
    const key = phase + "|" + JSON.stringify(rec.a) + "|" + Object.keys(others).length + "|" + JSON.stringify(others).length;
    if (!force && key === shown) return;
    const samePhase = shown && shown.split("|")[0] === phase, y = window.scrollY;
    shown = key;
    const a = rec.a;
    if (!a.home) {
      $main.innerHTML = `<p class="kicker">Hej! Two taps, anonymous.</p><h1>Where do you live?</h1>${question("home").replace(/<div class="q">.*?<\/div>/, "")}`;
    } else if (phase === "join" || (phase === "s0" && !a.before && !rec.late)) {
      $main.innerHTML = `<p class="kicker">You are on the map</p>${map()}${question("before")}${a.before ? line("Thanks! Keep your phone close.", "muted") : ""}`;
    } else {
      const Zd = ZONES[phase];
      $main.innerHTML = `<p class="kicker">${Zd.step}</p><div class="step"><span class="num">${Zd.n}</span><h1 style="margin:4px 0">${Zd.title}</h1></div>${body()}`;
    }
    window.scrollTo(0, samePhase ? y : 0);
  }
  function soon() { clearTimeout(timer); timer = setTimeout(() => render(), 300); }

  $main.addEventListener("click", (e) => {
    const b = e.target.closest(".opt"); if (!b) return;
    rec.a[b.parentElement.dataset.q] = b.dataset.v; save();
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {}
    render();
  });

  const net = IKL.connect({
    onStatus(on) {
      document.getElementById("dot").classList.toggle("on", on);
      document.getElementById("stxt").textContent = on ? "live" : "reconnecting";
      if (on && run && rec && rec.a.home) save();
    },
    onState(st) {
      const newRun = st.run !== run;
      run = st.run; phase = PHASES.includes(st.phase) ? st.phase : "join";
      if (newRun) {
        others = {}; ensureRecord();
        if (PHASES.indexOf(phase) > 1 && !rec.a.before) rec.late = true; // joined after Step 0: no "before" vote
      }
      render(true);
    },
    onRecord(rid, r) { if (rid === id) return; if (r) others[rid] = r; else delete others[rid]; soon(); },
  });
})();
</script>
</body>
</html>
