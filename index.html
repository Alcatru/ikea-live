<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0058a3">
<title>IKEA live · This room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Same grammar as the deck: kraft page, blue kicker, black step badge, IKEA Sans / Space Grotesk, square tiles, line pictograms. */
  body { background: var(--kraft); min-height: 100svh; }
  .app { max-width: 460px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; }
  .prog { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .prog i { height: 5px; background: #cdbb9c; }
  .prog i.on { background: var(--yellow); }
  header { padding: 10px 16px 9px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink); position: sticky; top: 0; z-index: 5; background: var(--kraft); }
  header .ttl { font: 700 11px var(--grot); letter-spacing: .16em; text-transform: uppercase; flex: 1; }
  header .st { font: 700 11px var(--grot); letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  main { flex: 1; padding: 16px 16px 8px; }
  .wait { text-align: center; padding: 60px 10px; color: var(--grey); }
  .dk { font-size: 11px; margin: 0; }
  h1 { font: 800 27px/1.08 var(--head); letter-spacing: -.01em; margin: 6px 0 12px; }
  .step { display: flex; align-items: flex-start; gap: 10px; margin: 6px 0 4px; }
  .step .badge { font-size: 19px; width: 30px; height: 30px; margin-top: 1px; }
  .step h1 { margin: 0; font-size: 25px; }
  .mapbox { margin: 8px -4px 4px; animation: rise .5s ease-out both; }
  .one { font: 500 16px/1.35 var(--grot); margin: 12px 0; padding-left: 12px; border-left: 5px solid var(--yellow); animation: rise .45s ease-out both; }
  .one.muted { color: #6b6255; font-size: 13.5px; border: 0; padding: 0; text-align: center; }
  .q { margin: 16px 0 10px; font: 800 19px/1.2 var(--head); }
  .opts { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
  .opts.n4 { grid-template-columns: repeat(2, 1fr); }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px 12px; border: 2px solid var(--ink); border-radius: 0; background: #fff; font: 700 14px/1.15 var(--grot); text-align: center; cursor: pointer; transition: transform .1s, background .15s; }
  .opt .ico { width: 46px; height: 46px; }
  .opt:active { transform: scale(.97); }
  .opt.sel { background: var(--yellow); }
  .opts.done .opt:not(.sel) { opacity: .38; }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font: 700 12.5px var(--grot); margin: 2px 0 6px; }
  .look { text-align: center; font: 800 32px var(--head); margin: 56px 0 20px; }
  .look .ico { width: 96px; height: 96px; margin: 0 auto 14px; animation: pulse2 1.4s ease-in-out infinite; }
  @keyframes pulse2 { 50% { transform: translateY(-6px); } }
  .ctx { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--ink); padding: 10px 12px; margin-top: 12px; }
  .ctx svg { width: 84px; flex: none; } .ctx p { margin: 0; font: 500 14.5px/1.35 var(--grot); }
  footer { padding: 12px 16px 20px; font: 400 11px/1.5 var(--grot); color: #6b6255; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="prog" id="prog"></div>
  <header>
    <span class="ttl">IKEA, reassembled</span>
    <span class="st"><span class="status-dot" id="dot"></span><span id="stxt">connecting</span></span>
  </header>
  <main id="main"><div class="wait">Connecting to the presentation…</div></main>
  <footer>Student project · Innovation Strategy, University of Fribourg.<br>Not affiliated with IKEA. Anonymous: no name, no personal data.</footer>
</div>
<script src="lib/mqtt.min.js"></script>
<script src="js/common.js"></script>
<script src="js/icons.js"></script>
<script src="js/rings.js"></script>
<script>
(function () {
  const { QUESTIONS, ZONES, PHASES, store, uid } = IKL;
  document.head.insertAdjacentHTML("beforeend", `<style>${ROOMMAP_CSS}</style>`);
  const $main = document.getElementById("main");
  let phase = null, run = null, id = null, rec = null, shown = null, others = {}, timer = null;

  function save() {
    store.set("rec:" + run, { id, rec });
    if (net.connected) net.publishRecord(run, id, Object.assign({ t: Date.now() }, rec));
  }
  function ensureRecord() {
    const saved = store.get("rec:" + run);
    if (saved && saved.rec && saved.rec.a) { id = saved.id; rec = saved.rec; }
    else { id = uid(); rec = { a: {} }; }
  }
  function question(key) {
    const Qd = QUESTIONS[key], cur = rec.a[key];
    return `<div class="q">${Qd.q}</div><div class="opts ${Qd.opts.length === 4 ? "n4" : ""} ${cur ? "done" : ""}" data-q="${key}">` +
      Qd.opts.map(([v, e, l]) => `<button class="opt ${cur === v ? "sel" : ""}" data-v="${v}">${ICON(e)}${l}</button>`).join("") + "</div>";
  }
  const lookUp = (t) => `<div class="look">${ICON("up")}Look up!<p class="one muted">${t}</p></div>`;
  const line = (t, cls = "") => `<p class="one ${cls}">${t}</p>`;
  function map() {
    const all = Object.assign({}, others); if (rec.a.home) all[id] = rec;
    return `<div class="mapbox">${roomMap(phase, all, id)}</div>`;
  }
  const LEG = {
    got: '<div class="legend"><span><i class="sw" style="background:var(--blue)"></i>Own car</span><span><i class="sw" style="background:var(--yellow)"></i>No own car</span></div>',
    react: '<div class="legend"><span><i class="sw" style="background:var(--green)"></i>Fine</span><span><i class="sw" style="background:#f28c28"></i>Meh</span><span><i class="sw" style="background:var(--red)"></i>Want it now</span></div>',
  };

  function body() {
    const a = rec.a;
    switch (phase) {
      case "s0":
        return map() + (a.got ? LEG.got : "") + question("got") +
          (a.got ? line(a.got === "car" ? "<b>You are the customer the blue box was built for.</b>" : "<b>No own car.</b> The blue box assumes you have one.") : "");
      case "s1":
      case "s2":
      case "s5": return lookUp(phase === "s5" ? "One last vote after our recommendations." : "Your dot is on the big screen.");
      case "s3": return map() + (a.react ? LEG.react : "") + question("react") + (a.react ? line("<b>Remember this feeling.</b>") : "");
      case "s4": return lookUp("Will it fit?");
      case "end": return question("after") + (a.after ? line("<b>Thanks!</b> Look at the screen.") : "") + map();
    }
    return "";
  }

  function render(force) {
    if (!run) return;
    const key = phase + "|" + JSON.stringify(rec.a) + "|" + Object.keys(others).length + "|" + JSON.stringify(others).length;
    if (!force && key === shown) return;
    const samePhase = shown && shown.split("|")[0] === phase, y = window.scrollY;
    shown = key;
    const a = rec.a, sn = ZONES[phase] && phase !== "end" ? ZONES[phase].n : (phase === "end" ? 5 : -1);
    document.getElementById("prog").innerHTML = [0, 1, 2, 3, 4, 5].map((n) => `<i class="${n === sn ? "on" : ""}"></i>`).join("");
    if (!a.home) {
      $main.innerHTML = `<p class="dk">Hej! Two taps, anonymous</p><h1>Where do you live?</h1>${question("home").replace(/<div class="q">.*?<\/div>/, "")}`;
    } else if (phase === "join" || (phase === "s0" && !a.before && !rec.late)) {
      $main.innerHTML = `<p class="dk">You are on the map</p>${map()}
        <div class="ctx"><svg viewBox="0 0 120 70" aria-hidden="true" stroke="#111" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="52" width="108" height="12" fill="#fff"/><path d="M20 55v6M36 55v6M52 55v6M68 55v6M84 55v6M100 55v6" stroke-width="1.2"/><path d="M24 20 l10 -7 h62 l-10 7z" fill="#3f84c4"/><path d="M86 20 l10 -7 v30 l-10 7z" fill="#004a8c"/><rect x="24" y="20" width="62" height="30" fill="var(--blue)"/><rect x="24" y="25" width="62" height="5" fill="var(--yellow)"/><rect x="48" y="38" width="14" height="12" fill="#fff"/></svg>
        <p><b>IKEA's classic model:</b> a huge store outside town that you drive to.</p></div>
        ${question("before")}${a.before ? line("Thanks! We'll ask again at the very end.", "muted") : line("Quick gut feeling. We'll ask again at the end.", "muted")}`;
    } else {
      const Zd = ZONES[phase];
      $main.innerHTML = `<p class="dk">${Zd.step}</p><div class="step"><span class="badge">${Zd.n}</span><h1>${Zd.title}</h1></div>${body()}`;
    }
    window.scrollTo(0, samePhase ? y : 0);
  }
  function soon() { clearTimeout(timer); timer = setTimeout(() => render(), 300); }

  $main.addEventListener("click", (e) => {
    const b = e.target.closest(".opt"); if (!b) return;
    rec.a[b.parentElement.dataset.q] = b.dataset.v; save();
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {}
    render();
  });

  const net = IKL.connect({
    onStatus(on) {
      document.getElementById("dot").classList.toggle("on", on);
      document.getElementById("stxt").textContent = on ? "live" : "reconnecting";
      if (on && run && rec && rec.a.home) save();
    },
    onState(st) {
      const newRun = st.run !== run;
      run = st.run; phase = PHASES.includes(st.phase) ? st.phase : "join";
      if (newRun) {
        others = {}; ensureRecord();
        if (PHASES.indexOf(phase) > 1 && !rec.a.before) rec.late = true; // joined after Step 0: no "before" vote
      }
      render(true);
    },
    onRecord(rid, r) { if (rid === id) return; if (r) others[rid] = r; else delete others[rid]; soon(); },
  });
})();
</script>
</body>
</html>
