<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IKEA live · Control</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font: 800 22px var(--sans); margin: 4px 0 2px; }
  .now { font: 700 15px var(--sans); margin: 6px 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { padding: 16px 10px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; font: 700 15px var(--sans); cursor: pointer; text-align: left; }
  button.cur { background: var(--yellow); }
  button.reset { grid-column: 1 / -1; background: var(--ink); color: #fff; text-align: center; margin-top: 8px; }
  .links { margin-top: 22px; font-size: 13px; line-height: 1.6; }
  .links code { display: block; background: var(--soft); padding: 6px 8px; border-radius: 4px; word-break: break-all; margin-bottom: 6px; }
</style>
</head>
<body>
<p class="kicker"><span class="status-dot" id="dot"></span> Control · backup remote</p>
<h1>IKEA live</h1>
<p class="now" id="now">Connecting…</p>
<div class="grid" id="grid"></div>
<div class="links" id="links"></div>
<script src="lib/mqtt.min.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  const { PHASES, ZONES, CFG, Q } = IKL;
  let st = null, n = 0; const recs = {};
  const names = { join: "QR · join", end: "Final vote" };
  const grid = document.getElementById("grid");
  function draw() {
    document.getElementById("now").textContent = st ? `Now: ${st.phase === "join" ? "join" : ZONES[st.phase].step} · ${n} phones` : "No session yet";
    grid.innerHTML = PHASES.map((p) => `<button data-p="${p}" class="${st && st.phase === p ? "cur" : ""}">${names[p] || ZONES[p].step}</button>`).join("") +
      '<button class="reset" data-reset="1">New session (resets all phones)</button>';
  }
  grid.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.reset) { if (!confirmReset()) return; net.publishState({ run: IKL.uid(), phase: "join", t: Date.now() }); return; }
    net.publishState({ run: st ? st.run : IKL.uid(), phase: b.dataset.p, t: Date.now() });
  });
  let armed = 0;
  function confirmReset() { // two taps instead of a browser dialog
    if (Date.now() - armed < 3000) return true;
    armed = Date.now(); const b = grid.querySelector(".reset"); b.textContent = "Tap again to confirm"; setTimeout(draw, 3000); return false;
  }
  const extra = (Q.get("room") ? "&room=" + CFG.room : "") + (Q.get("broker") ? "&broker=" + encodeURIComponent(CFG.broker) : "");
  const base = new URL("screen.html", location.href).toString();
  document.getElementById("links").innerHTML = "<b>Web Viewer addresses (one per Step opening slide)</b>" +
    PHASES.map((p) => `<div>${names[p] || ZONES[p].step}<code>${base}?phase=${p}${extra}</code></div>`).join("");
  const net = IKL.connect({
    onStatus(on) { document.getElementById("dot").classList.toggle("on", on); },
    onState(s) { if (!st || s.run !== st.run) { for (const k in recs) delete recs[k]; n = 0; } st = s; draw(); },
    onRecord(id, r) { if (r && !recs[id]) n++; if (!r && recs[id]) n--; recs[id] = r; draw(); },
  });
  draw();
})();
</script>
</body>
</html>
