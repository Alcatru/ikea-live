<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKEA live · Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Sized for a 16:9 Web Viewer frame inside PowerPoint: everything scales with the frame.
     One look for every page: the blue IKEA poster (yellow tag, white type, white cards, map on a white disc, yellow pills). */
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 1.6vw; background: var(--blue); color: #fff; }
  .stage { position: absolute; inset: 0; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; padding: 3vw 4vw; gap: 3vw; }
  .stage.full { display: flex; flex-direction: column; justify-content: center; align-items: stretch; padding: 2.4vw 6vw 3vw; }
  h1 { font: 800 2.7em/1.04 var(--sans); margin: .45em 0 .6em; letter-spacing: -.01em; }
  .join h1 { font-size: 3.6em; }
  .num { font: 700 8.5em/.92 var(--grot); letter-spacing: -.03em; color: var(--yellow); }
  .num small { font-size: .45em; letter-spacing: 0; }
  .cap { font: 700 1.45em/1.25 var(--sans); margin: .35em 0 0; max-width: 20em; }
  .legend { display: flex; gap: 1.8vw; font: 700 1.05em var(--sans); margin-top: 1.4vw; }
  .take { margin-top: 2.4vw; font-size: 1.2em; }
  .jr { position: relative; height: calc(100vh - 6vw); display: flex; align-items: center; justify-content: center; }
  .disc { width: min(100%, calc(100vh - 6vw)); aspect-ratio: 1; box-sizing: border-box; background: #fff; border-radius: 50%; box-shadow: 0 1.2vw 3vw rgba(0,0,0,.28); padding: 1.2vh; }
  .disc svg { width: 100%; height: 100%; display: block; }
  .pill { position: absolute; right: 1vw; bottom: 1vh; background: var(--yellow); color: var(--ink); font: 800 1.3em var(--sans); padding: .4em 1em .4em .5em; border-radius: 3em; box-shadow: 0 .6vw 1.4vw rgba(0,0,0,.25); display: flex; align-items: center; gap: .4em; white-space: nowrap; }
  .pill span { font: 700 2em/1 var(--grot); background: var(--ink); color: var(--yellow); border-radius: 2em; padding: .1em .45em; }
  .jq { display: flex; gap: 2vw; align-items: center; }
  .qrbig { background: #fff; padding: 1.2vw; border-radius: 1.2vw; width: 34vh; height: 34vh; box-shadow: 0 1vw 2.5vw rgba(0,0,0,.25); flex: none; }
  .qrbig svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .jsteps { display: grid; gap: 1.1vw; font: 700 1.3em/1.2 var(--sans); white-space: nowrap; }
  .jsteps div { display: flex; align-items: center; gap: .7em; }
  .stage .sticker { margin-top: 2.2vw; font-size: 1.15em; }
  .foot { position: absolute; right: 2vw; bottom: 1.2vw; font-size: .95em; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: .5em; z-index: 2; }
  /* final vote */
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 1vw 2.2vw; align-items: center; }
  .rows .who { display: flex; align-items: center; gap: .7em; font: 800 1.3em var(--sans); white-space: nowrap; }
  .rows .who i { width: 2.3em; height: 2.3em; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; flex: none; }
  .rows .who .ico { width: 1.7em; height: 1.7em; }
  .rows .lines { display: grid; gap: .5vw; }
  .rows .l { display: grid; grid-template-columns: 1fr 3.6em; gap: 1vw; align-items: center; }
  .rows .tr { height: 1.7vw; background: rgba(255,255,255,.14); border-radius: 1vw; overflow: hidden; }
  .rows .fl { height: 100%; border-radius: 1vw; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .rows .l span { font: 700 1.05em var(--grot); text-align: right; }
  .muted { color: rgba(255,255,255,.6); }
  .hands { display: flex; align-items: center; gap: .7em; margin-top: 1.2vw; }
  .hands .ico { width: 2.6em; height: 2.6em; color: var(--yellow); flex: none; }
  .vpill { position: absolute; right: 2vw; bottom: 2.4vw; background: #fff; color: var(--ink); font: 700 1em var(--sans); padding: .35em .9em; border-radius: 3em; display: inline-flex; align-items: center; gap: .45em; white-space: nowrap; box-shadow: 0 .4vw 1vw rgba(0,0,0,.18); }
  .vpill b { font: 700 1.25em/1 var(--grot); }
  .vpill i { width: .55em; height: .55em; border-radius: 50%; background: var(--green); display: inline-block; }
  .stage.full .vpill { position: static; margin-left: .8em; vertical-align: middle; }
  .endpill { position: static; display: inline-flex; margin-top: 2vw; box-shadow: none; font-size: 1.15em; }
</style>
</head>
<body>
<div id="root"></div>
<div class="foot"><span class="status-dot" id="dot"></span><span id="foot"></span></div>
<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="js/common.js"></script>
<script src="js/icons.js"></script>
<script src="js/rings.js"></script>
<script>
(function () {
  const { Q, CFG, PHASES, ZONES, QUESTIONS } = IKL;
  document.head.insertAdjacentHTML("beforeend", `<style>${ROOMMAP_CSS}</style>`);
  const root = document.getElementById("root");
  const pPhase = PHASES.includes(Q.get("phase")) ? Q.get("phase") : null;
  const view = Q.get("view") || "auto";        // auto | none
  const drive = Q.get("drive") !== "0";         // this frame moves the phones to its phase
  const force = Q.get("force") === "1";         // allow moving backwards
  const demo = parseInt(Q.get("demo") || "0", 10);
  let gState = null, records = {}, timer = null;
  // Backup: no live connection after a few seconds (or ?offline=1) -> the same page asks for a show of hands instead.
  let offline = Q.get("offline") === "1", everOn = false;

  const phoneURL = (() => {
    if (Q.get("qr")) return Q.get("qr");
    const u = new URL("index.html", location.href);
    if (Q.get("room")) u.searchParams.set("room", CFG.room);
    if (Q.get("broker")) u.searchParams.set("broker", CFG.broker);
    return u.toString();
  })();
  function qrSVG(text) { const qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
  const sum = (o) => Object.values(o).reduce((s, x) => s + x, 0);
  const sw = (c, t) => `<span><i class="sw" style="background:${c}"></i>${t}</span>`;
  const LEG = {
    got: `<div class="legend">${sw("var(--blue)", "Own car")}${sw("var(--yellow)", "No own car")}</div>`,
    react: `<div class="legend">${sw("var(--green)", "Fine")}${sw("#f28c28", "Meh")}${sw("var(--red)", "Want it now")}</div>`,
  };
  const sticker = (t) => `<div><span class="sticker take">${t}</span></div>`;

  function render() {
    const T = IKL.tally(records);
    const ph = pPhase || (gState && gState.phase) || "join";
    document.getElementById("foot").textContent = `${T.n} phones connected · ${demo ? "demo data" : CFG.room}`;
    if (view === "none") { root.innerHTML = ""; document.body.style.background = "transparent"; return; }
    const Zd = ZONES[ph], homes = sum(T.home);
    if (offline) records = {};
    const hands = (t) => `<p class="cap hands">${ICON("hand")}<span>${t}</span></p>`;
    const right = (pill = "") => `<div class="jr"><div class="disc">${roomMap(ph, records, null, { big: true })}</div>${pill}</div>`;
    const onMap = `<div class="pill"><span>${homes}</span> on the map</div>`;
    const voted = (k) => `<div class="vpill"><i></i><b>${k}</b> of ${T.n} have voted</div>`;
    const panel = (title, big, cap, extra = "", pill = "") => `<div class="stage"><div><span class="tagy">${Zd.step}</span><h1>${title}</h1>${big}${cap ? `<p class="cap">${cap}</p>` : ""}${extra}</div>${right(pill)}</div>`;

    if (ph === "join") {
      root.innerHTML = `<div class="stage join"><div><span class="tagy">Before we start</span>
          <h1>Put yourself<br>on the map.</h1>
          <div class="jq"><div class="qrbig">${qrSVG(phoneURL)}</div>
            <div class="jsteps"><div><b class="badge">1</b>Scan</div><div><b class="badge">2</b>Tap where you live</div><div><b class="badge">3</b>Find your dot</div></div></div>
          <div class="sticker">2 taps · anonymous</div></div>${right(offline ? "" : onMap)}</div>`;
    } else if (offline && ph === "s0") {
      root.innerHTML = panel("How did your last<br>furniture get home?", "", "", hands("Hands up if you brought it home in <b>your own car</b>.") + sticker("The blue box assumes you have one."));
    } else if (offline && ph === "s3") {
      root.innerHTML = panel("Not in stock.<br>Delivered later.", "", "", hands("Hands up if waiting a few days is <b>fine</b> for you."));
    } else if (offline && ph === "end") {
      root.innerHTML = panel("Big stores outside the city: still the right model?", "", "", hands("Hands up if IKEA should <b>change it</b>.") + hands("Hands up if IKEA should <b>keep it</b>."));
    } else if (ph === "s0") {
      const g = sum(T.got), noCar = g - (T.got.car || 0);
      root.innerHTML = panel("How did your last<br>furniture get home?", `<div class="num">${pct(noCar, g)}<small>%</small></div>`,
        "of you did <b>not</b> use your own car.", LEG.got + sticker("The blue box assumes you have one."), voted(g));
    } else if (ph === "s1") {
      root.innerHTML = panel("Cities grow.", `<div class="num">${pct(T.home.centre || 0, homes)}<small>%</small></div>`, "of this room lives in a city centre.");
    } else if (ph === "s2") {
      root.innerHTML = panel("A Planning Studio opens in town.", `<div class="num">${T.home.centre || 0}</div>`, "of you could walk there.");
    } else if (ph === "s3") {
      const r = sum(T.react), unhappy = (T.react.meh || 0) + (T.react.angry || 0);
      root.innerHTML = panel("Not in stock.<br>Delivered later.", `<div class="num">${pct(unhappy, r)}<small>%</small></div>`, "of you are not OK with waiting.", LEG.react, voted(r));
    } else if (ph === "s4") {
      root.innerHTML = panel("Will it fit?", "", "", "");
    } else if (ph === "s5") {
      root.innerHTML = panel("This room, mapped.", `<div class="num">${homes}</div>`, "customers took part.");
    } else if (ph === "end") {
      const tb = sum(T.before), ta = sum(T.after);
      const rows = QUESTIONS.before.opts.map(([v, e, l]) => {
        const b = pct(T.before[v] || 0, tb), a = pct(T.after[v] || 0, ta);
        return `<div class="who"><i>${ICON(e)}</i>${l}</div><div class="lines">
          <div class="l"><div class="tr"><div class="fl" style="width:${b}%;background:rgba(255,255,255,.45)"></div></div><span class="muted">${b}%</span></div>
          <div class="l"><div class="tr"><div class="fl" style="width:${a}%;background:var(--yellow)"></div></div><span>${a}%</span></div></div>`;
      }).join("");
      const dy = pct(T.after.change || 0, ta) - pct(T.before.change || 0, tb);
      root.innerHTML = `<div class="stage full"><div><span class="tagy">${Zd.step}</span></div><h1 style="margin:.4em 0 .5em;font-size:2.3em;white-space:nowrap">Big stores outside the city: still the right model?</h1>
        <div class="legend" style="margin:0 0 2vw">${sw("rgba(255,255,255,.45)", "Before we started")}${sw("var(--yellow)", "Now")}</div>
        <div class="rows">${rows}</div>
        <div><span class="pill endpill">${ta ? `<span>${(dy >= 0 ? "+" : "") + dy}</span> points for “change it” since the start` : "Vote on your phone."}</span>${voted(ta).replace("div","span").replace("</div>","</span>")}</div></div>`;
    }
  }
  setTimeout(() => { if (!everOn && !demo && !offline) { offline = true; render(); } }, 7000);
  function soon() { if (timer) return; timer = setTimeout(() => { timer = null; render(); }, 250); } // throttle, not debounce: a burst of answers must not freeze the screen

  if (demo) {
    records = IKL.demoRecords(demo, pPhase || "join");
    document.getElementById("dot").classList.add("on");
    render();
    return;
  }

  /* Drive the phones when this slide is actually on screen. PowerPoint can keep an add-in alive between edit view and
     the slide show (or preload it), so a one-shot "drive on load" is not enough: we also drive each time the frame becomes
     visible again. Forward only (force=1 allows going back, used on the join slide). */
  let decided = false;
  function maybeDrive() {
    if (decided || !drive || !pPhase || !net || !net.connected) return;
    if (document.visibilityState === "hidden") return;
    decided = true;
    const cur = gState ? PHASES.indexOf(gState.phase) : -1, want = PHASES.indexOf(pPhase);
    if (!gState) net.publishState({ run: IKL.uid(), phase: pPhase, t: Date.now() });
    else if (want > cur || (force && want !== cur)) net.publishState({ run: gState.run, phase: pPhase, t: Date.now() });
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { decided = false; setTimeout(maybeDrive, 300); } });
  window.addEventListener("focus", () => { decided = false; setTimeout(maybeDrive, 300); });
  let lastFrame = performance.now();
  (function tick(now) { // rAF stops while the frame is not painted: a long gap = the slide was off screen and is back
    if (now - lastFrame > 1500) { decided = false; setTimeout(maybeDrive, 300); }
    lastFrame = now; requestAnimationFrame(tick);
  })(performance.now());
  var net = null;
  net = IKL.connect({
    onStatus(on) { if (on && !everOn) { everOn = true; if (offline && Q.get("offline") !== "1") { offline = false; } } document.getElementById("dot").classList.toggle("on", on); if (on) setTimeout(maybeDrive, 1200); },
    onState(st) { if (!gState || st.run !== gState.run) records = {}; gState = st; maybeDrive(); soon(); },
    onRecord(id, rec) { if (rec) records[id] = rec; else delete records[id]; soon(); },
  });
  render();
})();
</script>
</body>
</html>
