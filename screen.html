<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKEA live · Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Sized for a 16:9 Web Viewer frame inside PowerPoint: everything scales with the frame. */
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 1.6vw; }
  .stage { position: absolute; inset: 0; padding: 3.2vw 4vw; display: grid; grid-template-columns: 1fr 1.15fr; gap: 4vw; align-items: center; }
  .stage.full { display: flex; flex-direction: column; align-items: stretch; }
  .kick { font: 700 1.05em var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--grey); display: flex; align-items: center; gap: .6em; }
  h1 { font: 800 2.6em/1.08 var(--sans); margin: .2em 0 .5em; }
  .num { font: 700 8em/1 var(--grot); letter-spacing: -.02em; }
  .num small { font-size: .45em; }
  .cap { font: 700 1.5em/1.25 var(--sans); margin: .3em 0 0; max-width: 22em; }
  .muted { color: var(--grey); }
  .mapcol { height: calc(100vh - 6.4vw); display: flex; align-items: center; justify-content: center; }
  .mapcol svg { height: 100%; width: auto; }
  .qr { background: #fff; border: .35vw solid var(--ink); border-radius: 1vw; padding: 1vw; width: 26vh; height: 26vh; margin-top: 1.2vw; }
  .qr svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .legend { display: flex; gap: 1.6vw; font-weight: 700; margin-top: 1.4vw; font-size: 1.1em; }
  .legend i { display: inline-block; width: 1em; height: 1em; border-radius: 50%; border: .15vw solid var(--ink); vertical-align: -.15em; margin-right: .4em; }
  .callout { display: inline-block; background: var(--yellow); padding: .8vw 1.4vw; border-radius: .6vw; font: 800 1.4em/1.2 var(--sans); margin-top: 1.6vw; }
  .pair { display: grid; grid-template-columns: 9em 1fr; gap: 1vw 1.5vw; align-items: center; font-weight: 700; font-size: 1.25em; }
  .pair .lines { display: grid; gap: .5vw; }
  .pair .l { display: grid; grid-template-columns: 1fr 4em; gap: 1vw; align-items: center; }
  .pair .l .tr { height: 2vw; background: var(--soft); border-radius: .3vw; overflow: hidden; }
  .pair .l .fl { height: 100%; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .pair .l span { font: 700 .95em var(--grot); text-align: right; }
  .foot { position: absolute; right: 2vw; bottom: 1.2vw; font-size: .8em; color: var(--grey); display: flex; align-items: center; gap: .5em; z-index: 2; }
</style>
</head>
<body>
<div id="root"></div>
<div class="foot"><span class="status-dot" id="dot"></span><span id="foot"></span></div>
<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="js/common.js"></script>
<script src="js/rings.js"></script>
<script>
(function () {
  const { Q, CFG, PHASES, ZONES, QUESTIONS } = IKL;
  document.head.insertAdjacentHTML("beforeend", `<style>${ROOMMAP_CSS}</style>`);
  const root = document.getElementById("root");
  const pPhase = PHASES.includes(Q.get("phase")) ? Q.get("phase") : null;
  const view = Q.get("view") || "auto";        // auto | none
  const drive = Q.get("drive") !== "0";         // this frame moves the phones to its phase
  const force = Q.get("force") === "1";         // allow moving backwards
  const demo = parseInt(Q.get("demo") || "0", 10);
  let gState = null, records = {}, timer = null;
  if (view === "none") document.body.style.background = "transparent";

  const phoneURL = (() => {
    const u = new URL("index.html", location.href);
    if (Q.get("room")) u.searchParams.set("room", CFG.room);
    if (Q.get("broker")) u.searchParams.set("broker", CFG.broker);
    return u.toString();
  })();
  function qrSVG(text) { const qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
  const sum = (o) => Object.values(o).reduce((s, x) => s + x, 0);
  const LEG = {
    got: '<div class="legend"><span><i style="background:var(--blue)"></i>Own car</span><span><i style="background:var(--yellow)"></i>No own car</span></div>',
    react: '<div class="legend"><span><i style="background:var(--green)"></i>Fine</span><span><i style="background:#f28c28"></i>Meh</span><span><i style="background:var(--red)"></i>Want it now</span></div>',
  };

  function render() {
    const T = IKL.tally(records);
    const ph = pPhase || (gState && gState.phase) || "join";
    document.getElementById("foot").textContent = `${T.n} phones · ${demo ? "demo data" : CFG.room}`;
    if (view === "none") { root.innerHTML = ""; return; }
    const Zd = ZONES[ph], kick = Zd ? `<span class="kick">${Zd.step}</span>` : "";
    const mapcol = `<div class="mapcol">${roomMap(ph, records, null, { big: true })}</div>`;
    const panel = (title, big, cap, extra = "") => `<div class="stage"><div>${kick}<h1>${title}</h1>${big}${cap ? `<p class="cap">${cap}</p>` : ""}${extra}</div>${mapcol}</div>`;
    const homes = sum(T.home);

    if (ph === "join") {
      root.innerHTML = `<div class="stage"><div><span class="kick">Before we start</span><h1>Scan. Put yourself on the map.</h1>
        <div class="num">${homes}</div><p class="cap muted">people on the map</p><div class="qr">${qrSVG(phoneURL)}</div></div>${mapcol}</div>`;
    } else if (ph === "s0") {
      const g = sum(T.got), noCar = g - (T.got.car || 0);
      root.innerHTML = panel("Your last furniture: how did it get home?", `<div class="num">${pct(noCar, g)}<small>%</small></div>`,
        "of you did <b>not</b> use your own car.", LEG.got + `<div><span class="callout">The blue box assumes you have one.</span></div>`);
    } else if (ph === "s1") {
      root.innerHTML = panel("Cities grow.", `<div class="num">${pct(T.home.centre || 0, homes)}<small>%</small></div>`, "of this room lives in a city centre.");
    } else if (ph === "s2") {
      root.innerHTML = panel("A Planning Studio opens in town.", `<div class="num">${T.home.centre || 0}</div>`, "of you could walk there.");
    } else if (ph === "s3") {
      const r = sum(T.react), unhappy = (T.react.meh || 0) + (T.react.angry || 0);
      root.innerHTML = panel("Not in stock today. Delivered later.", `<div class="num">${pct(unhappy, r)}<small>%</small></div>`, "of you are not OK with waiting.", LEG.react);
    } else if (ph === "s4") {
      root.innerHTML = panel("Will it fit?", "", "", "");
    } else if (ph === "s5") {
      root.innerHTML = panel("This room, mapped.", `<div class="num">${homes}</div>`, "customers took part.");
    } else if (ph === "end") {
      const tb = sum(T.before), ta = sum(T.after);
      const rows = QUESTIONS.before.opts.map(([v, e, l]) => {
        const b = pct(T.before[v] || 0, tb), a = pct(T.after[v] || 0, ta);
        return `<span>${e} ${l}</span><div class="lines">
          <div class="l"><div class="tr"><div class="fl" style="width:${b}%;background:var(--rule)"></div></div><span class="muted">${b}%</span></div>
          <div class="l"><div class="tr"><div class="fl" style="width:${a}%;background:var(--blue)"></div></div><span>${a}%</span></div></div>`;
      }).join("");
      const dy = pct(T.after.change || 0, ta) - pct(T.before.change || 0, tb);
      root.innerHTML = `<div class="stage full">${kick}<h1>Big stores outside the city: still the right model?</h1>
        <div class="legend" style="margin:0 0 1.2vw"><span><i style="background:var(--rule)"></i>Before we started</span><span><i style="background:var(--blue)"></i>Now</span></div>
        <div class="pair">${rows}</div>
        <div><span class="callout">${ta ? (dy >= 0 ? "+" : "") + dy + " points for “change it” since the start." : "Vote on your phone."}</span></div></div>`;
    }
  }
  function soon() { clearTimeout(timer); timer = setTimeout(render, 250); }

  if (demo) {
    records = IKL.demoRecords(demo, pPhase || "join");
    document.getElementById("dot").classList.add("on");
    render();
    return;
  }

  let decided = false;
  function maybeDrive() {
    if (decided || !drive || !pPhase) return; decided = true;
    const cur = gState ? PHASES.indexOf(gState.phase) : -1, want = PHASES.indexOf(pPhase);
    if (!gState) net.publishState({ run: IKL.uid(), phase: pPhase, t: Date.now() });
    else if (want > cur || force) net.publishState({ run: gState.run, phase: pPhase, t: Date.now() });
  }
  const net = IKL.connect({
    onStatus(on) { document.getElementById("dot").classList.toggle("on", on); if (on) setTimeout(maybeDrive, 1200); },
    onState(st) { if (!gState || st.run !== gState.run) records = {}; gState = st; maybeDrive(); soon(); },
    onRecord(id, rec) { if (rec) records[id] = rec; else delete records[id]; soon(); },
  });
  render();
})();
</script>
</body>
</html>
